[project]
name = "evescreener"
version = "1.0.0"
description = "Decision-support market screener for EVE Online's in-game market"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Isidore94" }]
dependencies = [
    "httpx[http2]>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evescreener"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default (plan.md §11 D5). Live calls run only when asked for:
#   uv run pytest -m network -q
addopts = "-m 'not network'"
markers = [
    "network: test performs live network calls (run intentionally, never in the default gate)",
]
filterwarnings = ["error::DeprecationWarning:evescreener.*"]
