[project]
name = "evescreener"
version = "0.1.0"
description = "Decision-support market screener for EVE Online, built on CCP's public ESI API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
]

[project.scripts]
evescreener = "evescreener.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evescreener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default (D5). Live calls run intentionally: `pytest -m network`.
addopts = "-m 'not network'"
markers = [
    "network: performs live calls against ESI or Discord; run intentionally, never in the default gate",
]
filterwarnings = ["error"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
